spring.application.name=lebnani-api

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lebnani}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lebnani}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lebnani}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${APP_JWT_SECRET:CHANGE_THIS_SECRET_CHANGE_THIS_SECRET_CHANGE_THIS_SECRET_123456}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}